# AWS equivalent of GCP's "iam.gke.io/gcp-service-account".
# Get the Role ARN after infra apply with "terraform output backup_role_arn"
# and paste it here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rds-backup
  namespace: app
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/prod-eks-cluster-rds-backup-role"
