# This annotation grants the pod using this ServiceAccount a
# temporary, narrowly-scoped set of AWS permissions via IRSA — no
# password or access key stored anywhere.
#
# This file is applied directly with kubectl, once per environment
# (dev cluster and prod cluster each get their own copy of these
# values) — it is not part of the GitOps-managed app, so it lives
# here in eks-infra-terraform rather than in the live-poll-app repo.
#
# Get the Role ARN after infra apply with:
#   terraform output -state=infra/envs/<dev|prod>/terraform.tfstate backup_role_arn
# and paste it in below, per cluster you apply this to.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rds-backup
  namespace: app
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/prod-eks-cluster-rds-backup-role"
