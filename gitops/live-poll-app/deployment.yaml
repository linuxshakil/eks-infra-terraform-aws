apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-poll-app
  namespace: app
  labels:
    app: live-poll-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: live-poll-app

  template:
    metadata:
      labels:
        app: live-poll-app
    spec:
      serviceAccountName: app-sa

      containers:
        - name: live-poll-app

          # This tag is updated automatically by the GitHub Actions
          # workflow .github/workflows/build-and-push.yml every time
          # app/** changes — see that file and the README section on
          # CI/CD for how the tag gets from a git push to here.
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/live-poll-app:latest

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: DB_HOST
              # Set this to the RDS endpoint after infra apply:
              #   terraform output -state=infra/terraform.tfstate rds_endpoint
              value: "REPLACE_WITH_RDS_ENDPOINT"

            - name: DB_NAME
              value: "pollapp"

            - name: DB_USER
              value: "pollapp"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  # This Secret does not exist in git. It is created at
                  # runtime by the External Secrets Operator from
                  # externalsecret.yaml in this same folder.
                  name: app-db-credentials
                  key: password

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
