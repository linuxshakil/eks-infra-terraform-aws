# Kustomize ties these plain manifests together into one unit that
# both ArgoCD and the CI pipeline can reference cleanly. The CI
# pipeline (.github/workflows/build-and-push.yml) uses
# "kustomize edit set image" to bump the image tag after every
# build — that's the only thing that ever changes here on a normal
# app deploy, and it's a plain git commit, not a `terraform apply`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - secretstore.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

images:
  - name: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/live-poll-app
    newTag: latest
