# This object contains no secret material at all — it only tells
# the External Secrets Operator which AWS region and which
# ServiceAccount's IRSA identity to use when it goes and fetches
# a secret from Secrets Manager. It's completely safe to commit
# this to a public git repo.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: app
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: app-sa
