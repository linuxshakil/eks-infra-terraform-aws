# Same AWS Load Balancer Controller pattern used throughout this
# repo. TLS/ACM is optional here — remove the two https-related
# annotations and the 443 listener if you just want to test over
# plain HTTP first.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: live-poll-app
  namespace: app
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Replace with a real ACM certificate ARN — see README Section 16
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-1:123456789012:certificate/REPLACE_ME"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  rules:
    - host: poll.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: live-poll-app
                port:
                  number: 80
