# IRSA annotation — same idea as everywhere else in this repo.
# This ServiceAccount can assume the "app" IAM role (created by
# Terraform in infra/modules/irsa) purely because its name and
# namespace match what that role's trust policy allows. No key,
# no secret, no credential is written here — only a role ARN
# reference and a name match.
#
# Replace the role-arn below with the value from:
#   terraform output -state=infra/terraform.tfstate app_role_arn
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: app
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/prod-eks-cluster-app-role"
