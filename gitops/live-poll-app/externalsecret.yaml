# Also completely safe to commit — this is a *pointer*
# ("go fetch the secret named app-db-password from Secrets
# Manager and put its value into a local Kubernetes Secret
# called app-db-credentials"), not the secret itself. The
# External Secrets Operator re-checks Secrets Manager every
# refreshInterval and keeps the local Secret in sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db-credentials
  namespace: app
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore

  target:
    name: app-db-credentials

  data:
    - secretKey: password
      remoteRef:
        key: app-db-password
