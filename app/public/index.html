<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Poll — Which cloud do you like?</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; }
    h1 { font-size: 20px; }
    .option { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
    .bar-track { flex: 1; background: #eee; border-radius: 6px; overflow: hidden; height: 22px; }
    .bar-fill { background: #2563eb; height: 100%; width: 0%; transition: width 0.3s ease; }
    button { padding: 6px 14px; cursor: pointer; }
    .count { width: 40px; text-align: right; }
  </style>
</head>
<body>
  <h1>Which cloud do you like?</h1>
  <div id="options"></div>

  <script>
    const ws = new WebSocket(`ws://${location.host}/ws`);
    const container = document.getElementById("options");

    function render(rows) {
      const total = rows.reduce((sum, r) => sum + r.votes, 0) || 1;

      container.innerHTML = rows.map(r => `
        <div class="option">
          <button onclick="vote(${r.id})">${r.label}</button>
          <div class="bar-track">
            <div class="bar-fill" style="width:${(r.votes / total) * 100}%"></div>
          </div>
          <div class="count">${r.votes}</div>
        </div>
      `).join("");
    }

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "results") render(msg.data);
    };

    async function vote(id) {
      await fetch(`/api/vote/${id}`, { method: "POST" });
    }
  </script>
</body>
</html>
