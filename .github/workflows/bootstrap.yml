name: Bootstrap Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true

jobs:

  bootstrap:
    name: Bootstrap AWS
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: bootstrap

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # NOTE: at the very first apply of bootstrap, no OIDC role
      # exists yet (this run is what creates it) — so run this
      # ONE-TIME step manually, using your own long-lived AWS
      # credentials (or SSO) from your local machine. After that,
      # the infra/apps workflows will use the OIDC role.
      - name: Configure AWS Credentials (bootstrap run — local secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -recursive -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-plan
          path: bootstrap/tfplan
          retention-days: 7

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Terraform Outputs
        run: terraform output

      - name: Bootstrap Summary
        run: |
          {
            echo "# Bootstrap Completed Successfully"
            echo ""
            echo "## Terraform Outputs"
            echo '```'
            terraform output
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
