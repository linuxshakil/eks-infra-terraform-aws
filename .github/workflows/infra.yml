name: Terraform Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

  pull_request:
    branches:
      - main
    paths:
      - "infra/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true

jobs:

  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    defaults:
      run:
        working-directory: infra

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      ############################################################
      # OIDC Authentication
      #
      # This is the direct AWS translation of GCP's
      # "google-github-actions/auth@v2 + workload_identity_provider"
      # step. No static access key is ever stored in the repo's
      # secrets — a GitHub OIDC token gets exchanged for
      # temporary STS credentials.
      ############################################################

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Providers
        run: terraform providers

      - name: Terraform Format
        run: terraform fmt -recursive -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -parallelism=20 \
            -input=false \
            -lock-timeout=10m \
            -no-color \
            -out=tfplan

      - name: Show Terraform Plan
        run: terraform show -no-color tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/tfplan
          retention-days: 30

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          terraform apply \
            -parallelism=20 \
            -input=false \
            -auto-approve \
            -no-color \
            tfplan | tee terraform-apply.log

      - name: Terraform Outputs
        if: github.ref == 'refs/heads/main'
        run: terraform output -no-color

      - name: Export Outputs
        if: github.ref == 'refs/heads/main'
        run: terraform output -json > terraform-output.json

      - name: Upload Outputs
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: infra/terraform-output.json

      - name: Upload Apply Log
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-log
          path: infra/terraform-apply.log

      - name: Deployment Summary
        if: github.ref == 'refs/heads/main'
        run: |
          {
            echo "# Terraform Infrastructure Deployment"
            echo ""
            echo "## Region"
            echo "${{ secrets.AWS_REGION }}"
            echo ""
            echo "## Branch"
            echo "${{ github.ref_name }}"
            echo ""
            echo "## Commit"
            echo "${{ github.sha }}"
            echo ""
            echo "## Terraform Outputs"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
